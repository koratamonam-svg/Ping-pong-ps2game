name: Build PS2 Game
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mipsel-linux-gnu binutils-mipsel-linux-gnu make
          
      - name: Build
        run: |
          # سنقوم بتحميل المكتبات الأساسية مباشرة في بيئة البناء
          git clone https://github.com/ps2dev/ps2sdk.git
          export PS2SDK=$(pwd)/ps2sdk
          
          # الآن نترجم مع إضافة مسار المكتبات (I-) ومسار الأكواد (-L)
          mipsel-linux-gnu-gcc -O2 -I$PS2SDK/ee/include -L$PS2SDK/ee/lib -o GAME.ELF main.c -lkernel
          
          
      - uses: actions/upload-artifact@v4
        with:
          name: game
          path: GAME.ELF
          
