name: Build PS2 Game
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mipsel-linux-gnu binutils-mipsel-linux-gnu make
          
      - name: Build
        run: |
          # نستخدم المترجم العام لـ MIPS
          mipsel-linux-gnu-gcc -c main.c -o main.o
          mipsel-linux-gnu-gcc -o GAME.ELF main.o
          
      - uses: actions/upload-artifact@v4
        with:
          name: game
          path: GAME.ELF
          
