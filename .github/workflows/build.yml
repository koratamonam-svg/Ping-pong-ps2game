name: Build PS2 Game
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mipsel-linux-gnu binutils-mipsel-linux-gnu
          # تحميل مكتبات البلايستيشن 2
          git clone https://github.com/ps2dev/ps2sdk.git
          
      - name: Build Game
        run: |
          export PS2SDK=$(pwd)/ps2sdk
          # قمنا بإضافة -D_EE لتعريف النظام أننا نستهدف المعالج الأساسي
          mipsel-linux-gnu-gcc -O2 -D_EE \
            -I$PS2SDK/ee/include -I$PS2SDK/common/include \
            -L$PS2SDK/ee/lib \
            -o GAME.ELF main.c -lkernel -lc
            
          
      - uses: actions/upload-artifact@v4
        with:
          name: game
          path: GAME.ELF
          
