name: Build PS2 Game
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2sdk:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Directly
        run: |
          # أمر الترجمة المباشر (يترجم ملف main.c إلى GAME.ELF)
          ee-gcc -O2 -I$PS2SDK/include -L$PS2SDK/lib -o GAME.ELF main.c -lgs -lc -lkernel
      - uses: actions/upload-artifact@v4
        with:
          name: game
          path: GAME.ELF
          
