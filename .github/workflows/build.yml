name: Build PS2 Game
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2sdk:latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build with PS2Dev
        run: |
          # استخدام المسار الكامل للمترجم لتفادي خطأ 127
          /usr/local/ps2dev/bin/ee-gcc -O2 -D_EE -D_PS2 \
            -I/usr/local/ps2dev/ps2sdk/ee/include \
            -I/usr/local/ps2dev/ps2sdk/common/include \
            -L/usr/local/ps2dev/ps2sdk/ee/lib \
            -o GAME.ELF main.c -lkernel -lc
          
      - uses: actions/upload-artifact@v4
        with:
          name: game
          path: GAME.ELF
          
