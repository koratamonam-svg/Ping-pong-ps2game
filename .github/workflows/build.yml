name: Build PS2 Game
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2sdk:latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Compile
        run: |
          # نستخدم المترجم الموجود داخل الحاوية مباشرة
          /usr/local/ps2dev/bin/ee-gcc -O2 -I/usr/local/ps2dev/ps2sdk/ee/include -L/usr/local/ps2dev/ps2sdk/ee/lib -o GAME.ELF main.c -lkernel
          
      - uses: actions/upload-artifact@v4
        with:
          name: game
          path: GAME.ELF
          
