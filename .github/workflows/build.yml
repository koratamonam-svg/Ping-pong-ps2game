name: Build PS2 Game
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install PS2 Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mipsel-linux-gnu binutils-mipsel-linux-gnu
          git clone https://github.com/ps2dev/ps2sdk.git
          
      - name: Build Game
        run: |
          # نحدد مسار المكتبات الذي قمنا بتحميله
          export PS2SDK=$(pwd)/ps2sdk
          
          # نستخدم مترجم الـ MIPS (الخاص بـ PS2) ونعطيه مسار المكتبات
          mipsel-linux-gnu-gcc -O2 -I$PS2SDK/ee/include -L$PS2SDK/ee/lib -o GAME.ELF main.c -lkernel -lc
          
      - uses: actions/upload-artifact@v4
        with:
          name: game
          path: GAME.ELF
          
