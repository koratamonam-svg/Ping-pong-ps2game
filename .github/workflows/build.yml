name: Build PS2 Game
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Compile Minimal
        run: |
          # نستخدم المترجم المدمج مباشرة
          gcc -o GAME.ELF main.c
          
      - uses: actions/upload-artifact@v4
        with:
          name: game
          path: GAME.ELF
          
