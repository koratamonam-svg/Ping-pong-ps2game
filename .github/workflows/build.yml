name: Build PS2 Game
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2sdk:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          make
      - uses: actions/upload-artifact@v4
        with:
          name: game
          path: GAME.ELF
          
