name: Build PS2 Game
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with PS2Dev
        uses: docker://ps2dev/ps2sdk:latest
        with:
          args: make
      - uses: actions/upload-artifact@v4
        with:
          name: game
          path: GAME.ELF
          
